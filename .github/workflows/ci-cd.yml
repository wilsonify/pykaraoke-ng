# CI/CD Pipeline for PyKaraoke NG
#
# Job graph (stage order):
#   unit-tests-python ─┐
#   unit-tests-rust   ─┼─► sonarqube ─► build (matrix) ─► release
#   unit-tests-frontend┘
#
# The app is one HTML file (web/index.html) + a pure-Python engine wheel +
# a thin Tauri shell, so the pipeline only needs those three test/build legs:
#   * pytest   → src/pykaraoke (runs under CPython and under Pyodide)
#   * vitest   → the JS extracted from web/index.html
#   * cargo    → src/runtimes/tauri/src-tauri (folder dialog + file reads)
#   * tauri build → bundles the wheel + vendored Pyodide/PyScript + web/
#
# Pull requests: run full CI, but do NOT trigger the release stage.
# Main branch pushes: run full CI + release stage.
#
# Required secrets:
#   SONAR_TOKEN          – SonarQube/SonarCloud authentication token
#   SONARQUBE_HOST_URL   – SonarQube server URL (e.g. https://sonarcloud.io)
name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# Cancel redundant runs on the same ref (e.g. rapid-fire pushes).
# Do NOT cancel in-progress runs on main so a release is never interrupted.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '20'

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # STAGE 0: Change Detection — skips the heavy Rust job when no Tauri/Rust
  #          files changed, saving apt installs + toolchain setup per run.
  # ═══════════════════════════════════════════════════════════════════════════

  changes:
    name: Detect Changed Files
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Emit a 'rust' output that is 'true' only when Tauri/Rust files change.
      # workflow_dispatch always sets outputs to 'true' (no base to diff against).
      - name: Detect Rust-related file changes
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            rust:
              - 'src/runtimes/tauri/src-tauri/**'
              - '.github/workflows/**'

  # ═══════════════════════════════════════════════════════════════════════════
  # STAGE 1: Unit Tests — Python, Rust, and Frontend run in parallel.
  # ═══════════════════════════════════════════════════════════════════════════

  unit-tests-python:
    name: Unit Tests / Python
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history needed for SonarQube blame data

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: 'pip install --only-binary :all: uv==0.4.30'

      - name: Restore uv cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}

      - name: Install dependencies via lockfile
        run: uv sync --frozen --extra dev --extra test

      - name: Run Python unit tests with coverage
        run: |
          uv run --frozen pytest tests/pykaraoke/ \
            --cov=src/pykaraoke \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov \
            --junitxml=pytest-junit.xml \
            -v

      - name: Upload Python coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: |
            coverage.xml
            pytest-junit.xml
            htmlcov/
          retention-days: 7

  unit-tests-frontend:
    name: Unit Tests / Frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Extracts the inline <script type="module"> from web/index.html and
      # runs the UI logic tests against it (vitest, no browser needed).
      - name: Run frontend unit tests
        working-directory: tests/web
        run: |
          npm ci
          npm test

  unit-tests-rust:
    name: Unit Tests / Rust
    runs-on: ubuntu-latest
    # Only run when Tauri/Rust files actually changed (or on workflow_dispatch).
    needs: [changes]
    if: needs.changes.outputs.rust == 'true' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Tauri v2 needs webkit2gtk-4.1 (ubuntu-latest ships it).
      # Increment the cache key suffix when the package list changes.
      - name: Cache apt package archives (Tauri system dependencies)
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-${{ runner.os }}-tauri-deps-v1

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
        with:
          workspaces: src/runtimes/tauri/src-tauri

      - name: Run Rust unit tests
        working-directory: src/runtimes/tauri/src-tauri
        run: cargo test

  # ═══════════════════════════════════════════════════════════════════════════
  # STAGE 1.5: Spec Kit Validation — enforce spec-driven development.
  # ═══════════════════════════════════════════════════════════════════════════

  spec-validation:
    name: Spec Kit Validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate spec completion
        env:
          PR_HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          chmod +x specs/ci/validate-spec-completion.sh
          # On pushes github.head_ref is empty; fall back to the current branch
          BRANCH_NAME="${PR_HEAD_REF:-$(git rev-parse --abbrev-ref HEAD)}"
          SAFE_BRANCH_NAME="$(printf '%s' "$BRANCH_NAME" | tr -cd '[:alnum:]._/-')"
          ./specs/ci/validate-spec-completion.sh "$SAFE_BRANCH_NAME"

  # ═══════════════════════════════════════════════════════════════════════════
  # STAGE 2: SonarQube — static analysis + quality gate enforcement.
  # ═══════════════════════════════════════════════════════════════════════════

  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: [unit-tests-python, unit-tests-rust, unit-tests-frontend, spec-validation]
    # unit-tests-rust may be 'skipped' when no Rust files changed; treat skipped as acceptable.
    if: always() && needs.unit-tests-python.result == 'success' && (needs.unit-tests-rust.result == 'success' || needs.unit-tests-rust.result == 'skipped') && needs.unit-tests-frontend.result == 'success' && (needs.spec-validation.result == 'success' || needs.spec-validation.result == 'skipped')
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # disable shallow clone for accurate blame/history

      - name: Download Python coverage artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-coverage

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONARQUBE_HOST_URL }}

      # Quality gate check — no continue-on-error: pipeline fails if gate fails.
      - name: SonarQube Quality Gate check
        uses: sonarsource/sonarqube-quality-gate-action@cf038b0e0cdecfa9e56c198bbb7d21d751d62c3b # v1.2.0
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONARQUBE_HOST_URL }}

  # ═══════════════════════════════════════════════════════════════════════════
  # STAGE 3: Platform Build Matrix — parallel native builds.
  #          `beforeBuildCommand` rebuilds the engine wheel and vendors the
  #          Pyodide/PyScript runtime into web/, then Tauri embeds web/.
  # ═══════════════════════════════════════════════════════════════════════════

  build:
    name: Build / ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    needs: [sonarqube]
    if: ${{ !cancelled() && needs.sonarqube.result == 'success' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
            bundles: deb
            artifact-name: tauri-linux-x86_64
          - platform: windows
            os: windows-latest
            bundles: nsis
            artifact-name: tauri-windows-x86_64
          - platform: macos
            os: macos-latest
            bundles: dmg
            artifact-name: tauri-macos-aarch64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # patchelf is only needed during the packaging/bundle step.
      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
        with:
          workspaces: src/runtimes/tauri/src-tauri

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # The Tauri CLI comes from the project's own devDependencies (v2).
      - name: Install Tauri CLI
        working-directory: src/runtimes/tauri
        run: npm ci

      # Python builds the engine wheel and downloads the Pyodide/PyScript
      # runtime that web/index.html loads (scripts/build-web.py).
      - name: Set up Python ${{ env.PYTHON_VERSION }} (for the engine wheel)
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build Tauri application
        working-directory: src/runtimes/tauri
        run: npx tauri build --bundles ${{ matrix.bundles }}

      - name: Upload platform build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: src/runtimes/tauri/src-tauri/target/release/bundle/
          retention-days: 14
          if-no-files-found: error

  # ═══════════════════════════════════════════════════════════════════════════
  # STAGE 4: Release — semver tag + GitHub Release with all platform artifacts.
  #          Runs ONLY on main branch pushes after all builds succeed.
  #          Pull requests never trigger this stage.
  # ═══════════════════════════════════════════════════════════════════════════

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build]
    if: ${{ !cancelled() && needs.build.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: write  # required to create tags and GitHub Releases
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history required for changelog generation

      # Determine next semver version from conventional commit messages.
      # dry_run avoids the API call that fails on forks with restricted GITHUB_TOKEN;
      # the tag is created later by softprops/action-gh-release.
      - name: Compute next semantic version
        id: tag
        uses: mathieudutour/github-tag-action@a22cf08638b34d5badda920f9daf6e72c477b07b # v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          release_branches: main,master
          tag_prefix: v
          dry_run: true

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: tauri-*
          path: release-artifacts/
          merge-multiple: false

      - name: Collect distributable files
        run: |
          mkdir -p release-files/
          find release-artifacts/ -type f \( \
            -name "*.deb" -o \
            -name "*.exe" -o \
            -name "*.dmg" -o \
            -name "*.msi" -o \
            -name "*.AppImage" \
          \) -exec cp {} release-files/ \;
          echo "=== Files to release ==="
          ls -lh release-files/
          file_count=$(find release-files/ -type f | wc -l)
          echo "Total: $file_count file(s)"
          test "$file_count" -gt 0 || { echo "ERROR: No distributable files found"; exit 1; }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191 # v2.0.8
        with:
          tag_name: ${{ steps.tag.outputs.new_tag }}
          name: PyKaraoke NG ${{ steps.tag.outputs.new_tag }}
          body: ${{ steps.tag.outputs.changelog }}
          draft: false
          prerelease: false
          make_latest: true
          files: release-files/*
