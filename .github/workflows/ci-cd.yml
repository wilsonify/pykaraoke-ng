# CI/CD Pipeline for PyKaraoke NG
#
# Job graph (stage order):
#   unit-tests-python ─┐
#   unit-tests-rust   ─┼─► sonarqube ─► build (matrix) ─► release
#   unit-tests-frontend┘
#
# The app is a static page (src/web/index.html + css/ + src/) + a pure-Python
# engine wheel + a thin Tauri shell, so the pipeline only needs those three
# test/build legs:
#   * pytest   → src/pykaraoke (runs under CPython and under Pyodide)
#   * vitest   → the JS in src/web/src (+ a wiring contract over index.html)
#   * cargo    → src/runtimes/tauri/src-tauri (folder dialog + file reads)
#   * tauri build → bundles the wheel + vendored Pyodide/PyScript + src/web/
#
# Pull requests: run full CI, but do NOT trigger the release stage.
# Main branch pushes: run full CI + release stage.
#
# Required secrets (secret name → action env var):
#   SONAR_TOKEN          – SonarQube/SonarCloud authentication token
#                          (mapped to env SONAR_TOKEN below)
#   SONARQUBE_HOST_URL   – SonarQube server URL (e.g. https://sonarcloud.io
#                          or your self-hosted URL; mapped to env SONAR_HOST_URL
#                          below, which is the name the scan/quality-gate actions
#                          actually read)
name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# Cancel redundant runs on the same ref (e.g. rapid-fire pushes).
# Do NOT cancel in-progress runs on main so a release is never interrupted.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '20'

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # STAGE 0: Change Detection — skips the heavy Rust job when no Tauri/Rust
  #          files changed, saving apt installs + toolchain setup per run.
  # ═══════════════════════════════════════════════════════════════════════════

  changes:
    name: Detect Changed Files
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Emit a 'rust' output that is 'true' only when Tauri/Rust files change.
      # workflow_dispatch always sets outputs to 'true' (no base to diff against).
      - name: Detect Rust-related file changes
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            rust:
              - 'src/runtimes/tauri/src-tauri/**'
              - '.github/workflows/**'

  # ═══════════════════════════════════════════════════════════════════════════
  # STAGE 1: Unit Tests — Python, Rust, and Frontend run in parallel.
  # ═══════════════════════════════════════════════════════════════════════════

  unit-tests-python:
    name: Unit Tests / Python
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history needed for SonarQube blame data

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: 'pip install --only-binary :all: uv==0.4.30'

      - name: Restore uv cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}

      - name: Install dependencies via lockfile
        # --no-build: install prebuilt wheels only for third-party deps;
        # building their sdists would execute untrusted build backends.
        # --no-binary-package pykaraoke-ng: narrow exception so uv may still
        # build the local editable project (hatchling), which has no wheel.
        # Without it, uv 0.4.30 errors: "`pykaraoke-ng @ editable+.` can't be
        # installed because it is marked as `--no-build` but has no binary
        # distribution". The exception is scoped to this package only, so no
        # third-party source build is permitted.
        run: uv sync --frozen --no-build --no-binary-package pykaraoke-ng --extra dev --extra test

      - name: Run Python unit tests with coverage
        # Same build flags as the sync step above: uv run re-checks the env,
        # so the editable-project exception must be repeated here.
        run: |
          uv run --frozen --no-build --no-binary-package pykaraoke-ng pytest tests/pykaraoke/ \
            --cov=src/pykaraoke \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov \
            --junitxml=pytest-junit.xml \
            -v

      - name: Upload Python coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: |
            coverage.xml
            pytest-junit.xml
            htmlcov/
          retention-days: 7

  unit-tests-frontend:
    name: Unit Tests / Frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Runs the UI logic tests against the shipped src/web/src/*.js modules
      # (vitest, no browser needed), plus a wiring contract over index.html.
      - name: Run frontend unit tests
        working-directory: tests/web
        # --ignore-scripts: vitest/esbuild run from the installed files;
        # no dependency install script is needed (npm still installs the
        # @esbuild/* platform binary via optionalDependencies).
        run: |
          npm ci --ignore-scripts
          npm test

  unit-tests-rust:
    name: Unit Tests / Rust
    runs-on: ubuntu-latest
    # Only run when Tauri/Rust files actually changed (or on workflow_dispatch).
    needs: [changes]
    if: needs.changes.outputs.rust == 'true' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Tauri v2 needs webkit2gtk-4.1 (ubuntu-latest ships it).
      # Increment the cache key suffix when the package list changes.
      - name: Cache apt package archives (Tauri system dependencies)
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-${{ runner.os }}-tauri-deps-v1

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
        with:
          workspaces: src/runtimes/tauri/src-tauri

      - name: Run Rust unit tests
        working-directory: src/runtimes/tauri/src-tauri
        run: cargo test

  # ═══════════════════════════════════════════════════════════════════════════
  # STAGE 1.5: OpenSpec Validation — enforce spec-driven development.
  #   `openspec validate --all --strict` checks every artifact under
  #   openspec/specs/ and openspec/changes/. `--archived` additionally
  #   fails when an archived change still has unchecked tasks.
  # ═══════════════════════════════════════════════════════════════════════════

  openspec-validation:
    name: OpenSpec Validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Pin the CLI: the spec schema and validator evolve between releases.
      # --ignore-scripts: the published CLI ships prebuilt dist/ + bin, so no
      # install hook is needed for it to run.
      - name: Install OpenSpec CLI (pinned)
        run: npm install -g --ignore-scripts @fission-ai/openspec@1.14.1

      - name: Validate specs and changes
        run: openspec validate --all --strict

      - name: Validate archived changes are complete
        run: openspec validate --archived

  # ═══════════════════════════════════════════════════════════════════════════
  # STAGE 2: SonarQube — static analysis + quality gate enforcement.
  # ═══════════════════════════════════════════════════════════════════════════

  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: [unit-tests-python, unit-tests-rust, unit-tests-frontend, openspec-validation]
    # unit-tests-rust may be 'skipped' when no Rust files changed; treat skipped as acceptable.
    if: always() && needs.unit-tests-python.result == 'success' && (needs.unit-tests-rust.result == 'success' || needs.unit-tests-rust.result == 'skipped') && needs.unit-tests-frontend.result == 'success' && (needs.openspec-validation.result == 'success' || needs.openspec-validation.result == 'skipped')
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # disable shallow clone for accurate blame/history

      - name: Download Python coverage artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-coverage

      # Fail fast with a clear message when auth/server config is missing,
      # instead of letting the scan fail obscurely and the quality-gate step
      # report a confusing ".scannerwork/report-task.txt does not exist".
      # Logic lives in .github/scripts/sonar-verify-config.sh (no code in YAML).
      - name: Verify SonarQube configuration
        run: bash .github/scripts/sonar-verify-config.sh
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONARQUBE_HOST_URL }}

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONARQUBE_HOST_URL }}

      # The quality-gate action reads .scannerwork/report-task.txt produced by
      # the scan step. Logic lives in
      # .github/scripts/sonar-verify-scan-metadata.sh (no code in YAML).
      - name: Verify scan metadata
        run: bash .github/scripts/sonar-verify-scan-metadata.sh

      # Quality gate check — no continue-on-error: pipeline fails if gate fails.
      - name: SonarQube Quality Gate check
        uses: sonarsource/sonarqube-quality-gate-action@cf038b0e0cdecfa9e56c198bbb7d21d751d62c3b # v1.2.0
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONARQUBE_HOST_URL }}

      # Best-effort triage dump — runs ONLY when something above failed.
      # Logic lives in .github/scripts/sonar-failure-diagnostics.sh (no code
      # in YAML). Upstream job results are passed as env vars since scripts
      # cannot read the `needs` context directly.
      - name: SonarQube failure diagnostics
        if: failure()
        run: bash .github/scripts/sonar-failure-diagnostics.sh
        env:
          SONAR_HOST_URL: ${{ secrets.SONARQUBE_HOST_URL }}
          NEEDS_PYTHON_RESULT: ${{ needs.unit-tests-python.result }}
          NEEDS_RUST_RESULT: ${{ needs.unit-tests-rust.result }}
          NEEDS_FRONTEND_RESULT: ${{ needs.unit-tests-frontend.result }}
          NEEDS_OPENSPEC_RESULT: ${{ needs.openspec-validation.result }}

      - name: Upload SonarQube diagnostics artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sonar-diagnostics
          path: |
            .scannerwork/
            sonar-project.properties
            coverage.xml
            pytest-junit.xml
          retention-days: 7
          if-no-files-found: warn

  # ═══════════════════════════════════════════════════════════════════════════
  # STAGE 3: Platform Build Matrix — parallel native builds.
  #          `beforeBuildCommand` rebuilds the engine wheel and vendors the
  #          Pyodide/PyScript runtime into src/web/, then Tauri embeds src/web/.
  # ═══════════════════════════════════════════════════════════════════════════

  build:
    name: Build / ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    needs: [sonarqube]
    if: ${{ !cancelled() && needs.sonarqube.result == 'success' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
            bundles: deb
            artifact-name: tauri-linux-x86_64
          - platform: windows
            os: windows-latest
            bundles: nsis
            artifact-name: tauri-windows-x86_64
          - platform: macos
            os: macos-latest
            bundles: dmg
            artifact-name: tauri-macos-aarch64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # patchelf is only needed during the packaging/bundle step.
      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
        with:
          workspaces: src/runtimes/tauri/src-tauri

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # The Tauri CLI comes from the project's own devDependencies (v2).
      # --ignore-scripts: the lockfile contains no install scripts, so the
      # CLI runs straight from the installed files.
      - name: Install Tauri CLI
        working-directory: src/runtimes/tauri
        run: npm ci --ignore-scripts

      # Python builds the engine wheel and downloads the Pyodide/PyScript
      # runtime that src/web/index.html loads (src/scripts/build-web.py).
      - name: Set up Python ${{ env.PYTHON_VERSION }} (for the engine wheel)
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build Tauri application
        working-directory: src/runtimes/tauri
        run: npx tauri build --bundles ${{ matrix.bundles }}

      - name: Upload platform build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: src/runtimes/tauri/src-tauri/target/release/bundle/
          retention-days: 14
          if-no-files-found: error

  # ═══════════════════════════════════════════════════════════════════════════
  # STAGE 4: Release — semver tag + GitHub Release with all platform artifacts.
  #          Runs ONLY on main branch pushes after all builds succeed.
  #          Pull requests never trigger this stage.
  # ═══════════════════════════════════════════════════════════════════════════

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build]
    if: ${{ !cancelled() && needs.build.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: write  # required to create tags and GitHub Releases
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history required for changelog generation

      # Determine next semver version from conventional commit messages.
      # dry_run avoids the API call that fails on forks with restricted GITHUB_TOKEN;
      # the tag is created later by softprops/action-gh-release.
      - name: Compute next semantic version
        id: tag
        uses: mathieudutour/github-tag-action@a22cf08638b34d5badda920f9daf6e72c477b07b # v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          release_branches: main,master
          tag_prefix: v
          dry_run: true

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: tauri-*
          path: release-artifacts/
          merge-multiple: false

      - name: Collect distributable files
        run: |
          mkdir -p release-files/
          find release-artifacts/ -type f \( \
            -name "*.deb" -o \
            -name "*.exe" -o \
            -name "*.dmg" -o \
            -name "*.msi" -o \
            -name "*.AppImage" \
          \) -exec cp {} release-files/ \;
          echo "=== Files to release ==="
          ls -lh release-files/
          file_count=$(find release-files/ -type f | wc -l)
          echo "Total: $file_count file(s)"
          test "$file_count" -gt 0 || { echo "ERROR: No distributable files found"; exit 1; }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191 # v2.0.8
        with:
          tag_name: ${{ steps.tag.outputs.new_tag }}
          name: PyKaraoke NG ${{ steps.tag.outputs.new_tag }}
          body: ${{ steps.tag.outputs.changelog }}
          draft: false
          prerelease: false
          make_latest: true
          files: release-files/*
