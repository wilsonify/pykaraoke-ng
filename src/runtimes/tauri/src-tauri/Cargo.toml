[package]
name = "pykaraoke-ng"
version = "0.8.0"
description = "PyKaraoke NG — thin desktop shell for the web karaoke app"
authors = ["PyKaraoke-NG Contributors"]
edition = "2021"

# Keep the Rust surface as small as possible: the app is HTML/CSS/JS +
# PyScript/Pyodide.  Rust only adds the genuinely native bits the web
# platform cannot do: a native folder dialog and file reading by path.
[lib]
name = "pykaraoke_ng_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
rfd = "0.15"

[profile.release]
strip = true
lto = true
codegen-units = 1
