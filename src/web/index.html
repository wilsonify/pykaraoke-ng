<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PyKaraoke NG</title>
  <style>
/* PyKaraoke NG — slim sidebar DJ panel (see specs/ux-design.md). */

:root {
  --bg: #14151a;
  --bg-elevated: #1c1e25;
  --bg-input: #101116;
  --border: #2c2f3a;
  --text: #e8e9ed;
  --text-dim: #9aa0ae;
  --accent: #e8b64c;
  --accent-strong: #ffd173;
  --danger: #e06c75;
  --ok: #7ec699;
  --radius: 6px;
  /* Duet parts (generic singer ids): blue = A, green = B, violet = shared. */
  --part-a: #6cb6ff;
  --part-a-lit: #a9d4ff;
  --part-b: #7ec699;
  --part-b-lit: #a9e3c0;
  --part-ab: #c39bff;
  --part-ab-lit: #ddc8ff;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
}

#app {
  display: flex;
  flex-direction: column;
  height: 100vh;
  width: 100%;
  max-width: 450px;
  margin: 0 auto;
}

/* ── Fixed top ─────────────────────────────────────────────────────── */
.app-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 10px;
  background: var(--bg-elevated);
  border-bottom: 1px solid var(--border);
  flex: none;
}
.app-title { font-weight: 600; font-size: 14px; }
.header-actions { display: flex; gap: 6px; align-items: center; }

/* ── Scrollable middle ─────────────────────────────────────────────── */
.main-column {
  flex: 1 1 auto;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 10px;
  min-height: 0;
}

.filters {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 6px 10px;
  background: var(--bg-elevated);
}
.filters summary { cursor: pointer; color: var(--text-dim); font-weight: 600; }
.filter-row {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 6px;
  flex-wrap: wrap;
}
.kind-filter { display: inline-flex; gap: 4px; align-items: center; color: var(--text-dim); }

.search-box input {
  width: 100%;
  padding: 8px 10px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--bg-input);
  color: var(--text);
  outline: none;
}
.search-box input:focus { border-color: var(--accent); }

/* ── Song lists ────────────────────────────────────────────────────── */
.section-label {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-dim);
  font-weight: 600;
}
.section-header { display: flex; justify-content: space-between; align-items: center; }

.song-list { display: flex; flex-direction: column; gap: 2px; margin-top: 4px; }
.no-results { color: var(--text-dim); padding: 8px 4px; font-style: italic; }

.song-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 5px 8px;
  border-radius: var(--radius);
  cursor: pointer;
  border: 1px solid transparent;
}
.song-row:hover { background: var(--bg-elevated); }
.song-row.selected { background: var(--bg-elevated); border-color: var(--accent); }

.song-row-info { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.song-row-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.song-row-file { font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.results-section, .queue-section, .player-section { display: flex; flex-direction: column; gap: 4px; }

/* ── Badges ────────────────────────────────────────────────────────── */
.badge {
  font-size: 10px;
  padding: 1px 5px;
  border-radius: 3px;
  border: 1px solid var(--border);
  color: var(--text-dim);
  flex: none;
}
.badge-cdg { color: var(--ok); border-color: var(--ok); }
.badge-kar { color: var(--accent); border-color: var(--accent); }
.badge-mpg { color: #6cb6ff; border-color: #6cb6ff; }

/* ── Stage ─────────────────────────────────────────────────────────── */
.stage {
  background: #000;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 90px;
  padding: 8px;
  position: relative;
}
#cdg-canvas {
  image-rendering: pixelated;
  max-width: 100%;
  background: #000;
}
.stage-empty { color: var(--text-dim); font-style: italic; }
#video-slot video { display: block; border-radius: 4px; }
.lyrics {
  margin-top: 8px;
  width: 100%;
  text-align: center;
}
.lyric-line {
  font-size: 16px;
  font-weight: 600;
  color: var(--text-dim);
  min-height: 1.3em;
}
/* Duet lines: colour by singer/part; untagged lines keep the dim default. */
.lyric-line.part-a { color: var(--part-a); }
.lyric-line.part-b { color: var(--part-b); }
.lyric-line.part-ab { color: var(--part-ab); }
/* Declared after the part colours so the upcoming line always dims. */
.lyric-line.lyric-next { color: #5a5f6e; font-size: 14px; }
/* Part chip: "A", "B", "A+B", or the song's [pa:]/[pb:] display names. */
.lyric-part {
  display: inline-block;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.05em;
  margin-right: 5px;
  padding: 0 4px;
  border: 1px solid currentColor;
  border-radius: 3px;
  vertical-align: 1px;
}
.lyric-syl.lit { color: var(--accent-strong); }
/* Sung syllables light up in the line's own (brighter) part colour. */
.lyric-line.part-a .lyric-syl.lit { color: var(--part-a-lit); }
.lyric-line.part-b .lyric-syl.lit { color: var(--part-b-lit); }
.lyric-line.part-ab .lyric-syl.lit { color: var(--part-ab-lit); }

/* ── Player controls ───────────────────────────────────────────────── */
.now-playing-info { margin-top: 6px; }
.song-title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.song-artist { font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.player-controls {
  display: flex;
  gap: 6px;
  align-items: center;
  justify-content: center;
  margin-top: 6px;
}
.btn-control {
  width: 34px;
  height: 34px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--bg-elevated);
  color: var(--text);
  cursor: pointer;
  font-size: 14px;
  line-height: 1;
}
.btn-control:hover { border-color: var(--accent); }
.btn-play { background: var(--accent); color: #1a1408; border-color: var(--accent); }

.progress-row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
#progress-slider, #volume-slider { flex: 1; accent-color: var(--accent); }
.time-display { font-size: 11px; color: var(--text-dim); white-space: nowrap; }
.volume-row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }

/* ── Buttons ───────────────────────────────────────────────────────── */
.btn {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--bg-elevated);
  color: var(--text);
  cursor: pointer;
  padding: 5px 10px;
  font-size: 12px;
}
.btn:hover { border-color: var(--accent); }
.btn-primary { background: var(--accent); color: #1a1408; border-color: var(--accent); font-weight: 600; }
.btn-primary:hover { background: var(--accent-strong); }
.btn-sm { padding: 3px 8px; font-size: 11px; }
.btn-icon { padding: 2px 6px; font-size: 12px; background: transparent; }

/* ── Status bar ────────────────────────────────────────────────────── */
.status-bar {
  flex: none;
  display: flex;
  justify-content: space-between;
  gap: 8px;
  padding: 6px 10px;
  background: var(--bg-elevated);
  border-top: 1px solid var(--border);
  font-size: 11px;
  color: var(--text-dim);
  white-space: nowrap;
  overflow: hidden;
}

/* ── Settings panel (inline, no modal) ─────────────────────────────── */
.settings-panel {
  flex: none;
  border-top: 1px solid var(--border);
  background: var(--bg-elevated);
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.settings-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}
.settings-row select {
  background: var(--bg-input);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 4px 6px;
}

.muted { color: var(--text-dim); }

  <script type="py">
"""PyScript bridge: expose the karaoke engine to the inline app script.

Loaded by PyScript from this ``<script type="py">`` block.  Builds a
:class:`pykaraoke.webapp.KaraokeApp` and publishes a single JSON-friendly
dispatcher to ``window.pykaraoke_api``.

Boundary rules:

* JS ``Uint8Array`` arguments arrive as Python ``bytes``/``memoryview``
  (Pyodide auto-conversion), which the engine accepts directly.
* JS objects/arrays are converted deeply with ``to_py()`` so the engine
  sees plain dicts/lists.
* Return values are Python objects; the app script converts PyProxies
  with ``toJs()``.  ``None`` becomes JS ``undefined`` automatically.
"""

from js import window

from pykaraoke.webapp import KaraokeApp

app = KaraokeApp()


def _to_py(value):
    """Deep-convert a JS value into a plain Python value."""
    if hasattr(value, "to_py"):
        return value.to_py()
    return value


def api(name, *args):
    """Call ``app.<name>(*args)`` with converted arguments."""
    return getattr(app, name)(*[_to_py(a) for a in args])


window.pykaraoke_api = api
</script>
  <script type="module">
// PyKaraoke NG — web UI (vanilla JS module, no framework, no build step).
//
// Architecture: this file owns the UI, file access and playback; Python
// (PyScript/Pyodide, see the <script type="py"> block above) owns the
// engine: library, search, CDG decoding, MIDI parsing.  The JS↔Python
// boundary is the single `window.pykaraoke_api(name, ...args)` dispatcher.
//
// Everything exported from this module is pure and unit-tested with
// vitest; the browser wiring runs only when `document` exists.

export const CDG_WIDTH = 288;
export const CDG_HEIGHT = 192;

export const ZOOM_SCALES = { quick: 0.75, int: 1, full: 1.5, soft: 2 };

// ─────────────────────────────────────────────────────────────────────
// Pure helpers (exported for tests)
// ─────────────────────────────────────────────────────────────────────

export function formatTime(ms) {
  const total = Math.max(0, Math.floor(ms / 1000));
  const m = Math.floor(total / 60);
  const s = total % 60;
  return `${m}:${String(s).padStart(2, '0')}`;
}

export function debounce(fn, wait) {
  let timer = null;
  return (...args) => {
    clearTimeout(timer);
    timer = setTimeout(() => fn(...args), wait);
  };
}

export function escapeHtml(text) {
  return String(text).replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[c]));
}

/** Parse "Artist - Title" style display strings out of song metadata. */
export function songLabel(song) {
  const title = song.title || song.filename.replace(/\.[^.]+$/, '');
  const artist = song.artist ? ` — ${song.artist}` : '';
  return `${title}${artist}`;
}

export const KIND_BADGE = { cdg: 'CDG', kar: 'KAR', mpg: 'MPG', lrc: 'LRC' };

/** Extension of the companion file carrying word-level lyric timing. */
export const ELRC_EXT = '.elrc';

/**
 * Lowercased basename key for a loose-file companion of *song*
 * (e.g. `song.elrc` next to `song.lrc`), or null when unusable.
 * Looks the key up in `state.pathByBase`.
 */
export function companionBaseName(song, ext) {
  const filename = String((song && song.filename) || '');
  const stem = filename.replace(/\.[^.]+$/, '').toLowerCase();
  return stem ? `${stem}${ext}` : null;
}

/**
 * Zip member name of a companion file for a song inside a zip, or null.
 * Mirrors the `zip!member` id that readSongBytes() splits apart.
 */
export function companionMember(song, ext) {
  if (!song || !song.zip_name) return null;
  const member = String(song.id || '').split('!').slice(1).join('!');
  if (!member) return null;
  return member.replace(/\.[^./\\]+$/, ext);
}

/** A FIFO queue of songs with indexed removal / moves. */
export class SongQueue {
  constructor(items = []) {
    this.items = [...items];
  }
  get length() {
    return this.items.length;
  }
  push(song) {
    this.items.push(song);
  }
  removeAt(index) {
    if (index < 0 || index >= this.items.length) return null;
    return this.items.splice(index, 1)[0];
  }
  move(index, delta) {
    const target = index + delta;
    if (index < 0 || index >= this.items.length) return;
    if (target < 0 || target >= this.items.length) return;
    const [item] = this.items.splice(index, 1);
    this.items.splice(target, 0, item);
  }
  clear() {
    this.items = [];
  }
  next() {
    return this.items.shift() ?? null;
  }
}

/** Generic duet part ids (never gendered); 'ab' is a shared A+B line. */
export const PART_IDS = ['a', 'b', 'ab'];

/**
 * CSS modifier class for a lyric line's part: 'part-a' | 'part-b' |
 * 'part-ab', or '' when the line has no (recognised) part.
 */
export function partClass(part) {
  const id = String(part || '').toLowerCase();
  return PART_IDS.includes(id) ? `part-${id}` : '';
}

/**
 * Human label for a lyric line's part, for the in-line part chip.
 * `parts` is the song's optional {a, b} display-name map; the generic
 * "A", "B" or "A+B" id is the fallback when no singer is named.
 */
export function partLabel(parts, part) {
  const id = String(part || '').toLowerCase();
  if (!PART_IDS.includes(id)) return '';
  const names = parts || {};
  if (id === 'ab') {
    return names.a && names.b ? `${names.a} + ${names.b}` : 'A+B';
  }
  return names[id] || id.toUpperCase();
}

/**
 * Group timed lyric syllables into display lines.
 * Input: [{ms, text, type, line, part?}] — type 0 is a sung syllable,
 * part ('a'|'b'|'ab') marks a duet line.
 * Output: [{line, ms, part, syllables: [{ms, text}]}] sorted by time.
 */
export function buildLyricLines(lyrics) {
  const sung = (lyrics || []).filter((s) => Number(s.type || 0) === 0);
  const byLine = new Map();
  for (const syl of sung) {
    const key = Number(syl.line) || 0;
    if (!byLine.has(key)) byLine.set(key, []);
    byLine.get(key).push(syl);
  }
  const lines = [...byLine.entries()]
    .sort((a, b) => a[1][0].ms - b[1][0].ms)
    .map(([line, syllables]) => ({
      line,
      ms: syllables[0].ms,
      // Duet part shared by every syllable of the line, if tagged.
      part: syllables.find((s) => s.part && partClass(s.part))?.part || null,
      // Deterministic per-line order by time so the renderer can highlight
      // by index even when the source timestamps are out of order.
      syllables: syllables
        .map((s) => ({ ms: s.ms, text: s.text }))
        .sort((a, b) => a.ms - b.ms),
    }));
  return lines;
}

/**
 * Pure highlight state for a lyric timeline at *ms*.
 *
 * Returns the active line index and how many of its syllables have been
 * sung.  Deterministic and order-independent — safe to call every frame
 * from the playback loop and from tests with a fake clock.
 */
export function highlightState(lines, ms) {
  if (!lines || !lines.length) return { lineIdx: -1, litCount: 0 };
  let lineIdx = 0;
  while (lineIdx < lines.length - 1 && lines[lineIdx + 1].ms <= ms) lineIdx++;
  const line = lines[lineIdx];
  let litCount = 0;
  for (const syl of line.syllables) {
    if (syl.ms <= ms) litCount++;
    else break;
  }
  return { lineIdx, litCount };
}

/** MIDI note number → frequency in Hz (A4 = 69 = 440 Hz). */
export function noteToFrequency(note) {
  return 440 * Math.pow(2, (note - 69) / 12);
}

/**
 * Small General-MIDI-ish voice map: program → {type, gain, shift}.
 * Kept intentionally tiny — good enough for karaoke backing tracks.
 */
const GM_VOICES = {
  0: { type: 'triangle', gain: 0.30, shift: 0 },   // Acoustic grand piano
  24: { type: 'triangle', gain: 0.28, shift: 0 },  // Nylon guitar
  25: { type: 'triangle', gain: 0.28, shift: 0 },  // Steel guitar
  32: { type: 'sawtooth', gain: 0.16, shift: -1 }, // Acoustic bass
  33: { type: 'sawtooth', gain: 0.16, shift: -1 }, // Electric bass
  34: { type: 'sawtooth', gain: 0.16, shift: -1 }, // Fretless bass
  40: { type: 'triangle', gain: 0.28, shift: 0 },  // Violin
  41: { type: 'triangle', gain: 0.28, shift: 0 },  // Viola
  48: { type: 'sawtooth', gain: 0.18, shift: 0 },  // String ensemble
  52: { type: 'sawtooth', gain: 0.18, shift: 0 },  // Synth choir
  56: { type: 'sawtooth', gain: 0.18, shift: 0 },  // Orchestra hit
  73: { type: 'triangle', gain: 0.30, shift: 1 },  // Flute
  74: { type: 'triangle', gain: 0.30, shift: 1 },  // Recorder
  80: { type: 'square', gain: 0.16, shift: 0 },    // Square lead
  81: { type: 'sawtooth', gain: 0.20, shift: 0 },  // Saw lead
};

export function voiceFor(program, channel) {
  if (channel === 9) return { drum: true };
  return GM_VOICES[program] ?? GM_VOICES[0];
}

/**
 * Convert parsed MIDI notes into a plain audio timeline.
 * Input notes: [startMs, channel, note, velocity, durationMs].
 * Output: [{startMs, endMs, freq, gain, type, drum}] sorted by start.
 */
export function computeNoteTimeline(notes, programs = {}) {
  const timeline = [];
  for (const [startMs, channel, note, velocity, durationMs] of notes) {
    const voice = voiceFor(programs[String(channel)], channel);
    const vel = Math.min(1, Math.max(0.1, (velocity || 80) / 127));
    timeline.push({
      startMs,
      endMs: startMs + Math.max(durationMs, 40),
      freq: voice.drum ? 0 : noteToFrequency(note + (voice.shift || 0) * 12),
      gain: (voice.gain || 0.2) * vel,
      type: voice.type || 'triangle',
      drum: !!voice.drum,
    });
  }
  timeline.sort((a, b) => a.startMs - b.startMs);
  return timeline;
}

/**
 * Write a CDG tile's RGB bytes into a full-frame RGBA buffer.
 * tile.data is 48*48*3 bytes; (x, y) is the tile grid position (0-5, 0-3).
 */
export function writeTileRgba(tileData, rgba, width, x, y) {
  const TILE = 48;
  for (let row = 0; row < TILE; row++) {
    const src = row * TILE * 3;
    const dst = ((y * TILE + row) * width + x * TILE) * 4;
    for (let col = 0; col < TILE; col++) {
      rgba[dst + col * 4] = tileData[src + col * 3];
      rgba[dst + col * 4 + 1] = tileData[src + col * 3 + 1];
      rgba[dst + col * 4 + 2] = tileData[src + col * 3 + 2];
      rgba[dst + col * 4 + 3] = 255;
    }
  }
}

export function findSyllableAt(lines, ms) {
  for (const line of lines) {
    for (const syl of line.syllables) {
      if (syl.ms > ms) return syl;
    }
  }
  return null;
}

// ─────────────────────────────────────────────────────────────────────
// Browser wiring (only when a DOM exists)
// ─────────────────────────────────────────────────────────────────────

const isBrowser = typeof window !== 'undefined' && typeof document !== 'undefined';

if (isBrowser) {
  const $ = (id) => document.getElementById(id);

  const tauriCore = window.__TAURI__?.core; // {invoke, convertFileSrc} (withGlobalTauri)

  // Engine bridge
  function callApi(name, ...args) {
    const fn = window.pykaraoke_api;
    if (typeof fn !== 'function') throw new Error('engine not ready');
    const proxy = fn(name, ...args);
    if (proxy == null) return null;
    if (proxy.toJs) {
      const value = proxy.toJs({ dict_converter: Object.fromEntries });
      proxy.destroy();
      return value;
    }
    return proxy;
  }

  // ── State ──────────────────────────────────────────────────────────
  const state = {
    queue: new SongQueue(),
    settings: { volume: 0.75, sort: 'filename', zoom: 'int', lookInsideZips: true },
    files: new Map(),       // browser mode: relative path -> File
    pathByBase: new Map(),  // lowercased basename -> loadable path (both modes)
    results: [],
    selectedResult: -1,
    current: null,          // Song being played
    playing: false,
    durationMs: 0,
    lyricLines: null,
    parts: null,           // song-level duet names {a, b} (or null)
    lastLyricLine: -1,
    cdgKey: null,
    audioEl: null,
    videoEl: null,
    synth: null,
    songClock: 0,
    rafId: null,
    frameFn: null,
  };

  // ── File access ────────────────────────────────────────────────────
  async function readBytes(path) {
    if (tauriCore) {
      const res = await tauriCore.invoke('read_file', { path });
      if (res instanceof ArrayBuffer) return new Uint8Array(res);
      if (ArrayBuffer.isView(res)) return new Uint8Array(res.buffer, res.byteOffset, res.byteLength);
      if (Array.isArray(res)) return Uint8Array.from(res);
      throw new Error(`unexpected read_file response for ${path}`);
    }
    const file = state.files.get(path);
    if (!file) throw new Error(`file not loaded: ${path}`);
    return new Uint8Array(await file.arrayBuffer());
  }

  function mediaUrl(path) {
    if (tauriCore) return tauriCore.convertFileSrc(path);
    const file = state.files.get(path);
    if (!file) throw new Error(`file not loaded: ${path}`);
    return URL.createObjectURL(file);
  }

  /** Decode text bytes: UTF-8 first, fall back to Windows-1252. */
  function decodeText(bytes) {
    const utf8 = new TextDecoder('utf-8', { fatal: false }).decode(bytes);
    if (!utf8.includes('\uFFFD')) return utf8;
    return new TextDecoder('windows-1252').decode(bytes);
  }

  function resolveSongPath(song) {
    // Tauri: absolute path. Browser: webkitRelativePath.
    return song.path;
  }

  function resolveAudioPath(song) {
    if (song.audio_name) {
      const base = state.pathByBase.get(String(song.audio_name).toLowerCase());
      if (base) return base;
    }
    // Fallback: sibling file with the same stem and an audio extension.
    const stem = song.filename.replace(/\.[^.]+$/, '').toLowerCase();
    const candidates = ['.mp3', '.ogg', '.wav'];
    for (const ext of candidates) {
      const hit = state.pathByBase.get(`${stem}${ext}`);
      if (hit) return hit;
    }
    return null;
  }

  /** Bytes of the song's own file (.cdg/.kar/.mid/.mpg), reading through zips. */
  async function readSongBytes(song) {
    if (song.zip_name) {
      const zipPath = state.pathByBase.get(String(song.zip_name).toLowerCase());
      if (!zipPath) throw new Error(`zip not loaded: ${song.zip_name}`);
      const zipBytes = await readBytes(zipPath);
      const member = String(song.id).split('!').slice(1).join('!');
      const bytes = callApi('read_zip_member', song.zip_name, member);
      if (!bytes) throw new Error(`member not found in zip: ${member}`);
      return bytes;
    }
    return readBytes(resolveSongPath(song));
  }

  /**
   * Text of a companion file (e.g. ``.elrc``) for *song*, or null when it
   * is missing or unreadable — a companion file is always optional.
   */
  async function readCompanionText(song, ext) {
    try {
      if (song.zip_name) {
        const member = companionMember(song, ext);
        if (!member) return null;
        const bytes = callApi('read_zip_member', song.zip_name, member);
        if (!bytes || !bytes.length) return null;
        return decodeText(bytes);
      }
      const base = companionBaseName(song, ext);
      const path = base && state.pathByBase.get(base);
      if (!path) return null;
      return decodeText(await readBytes(path));
    } catch (err) {
      console.warn(`companion ${ext} read failed`, err);
      return null;
    }
  }

  /** Whether a companion .elrc (word timing) file exists for *song*. */
  function hasElrc(song) {
    if (!song || song.kind !== 'lrc') return false;
    if (song.zip_name) {
      const member = companionMember(song, ELRC_EXT);
      if (!member) return false;
      try {
        const names = callApi('zip_members', song.zip_name);
        return Array.isArray(names) &&
          names.some((name) => String(name).toLowerCase() === member.toLowerCase());
      } catch {
        return false; // engine not ready (or zip not loaded yet)
      }
    }
    const base = companionBaseName(song, ELRC_EXT);
    return !!(base && state.pathByBase.has(base));
  }

  // ── Engine / boot ──────────────────────────────────────────────────
  function waitFor(cond, timeoutMs) {
    return new Promise((resolve) => {
      const start = Date.now();
      const tick = () => {
        if (cond()) return resolve(true);
        if (Date.now() - start > timeoutMs) return resolve(false);
        setTimeout(tick, 100);
      };
      tick();
    });
  }

  async function boot() {
    setStatus('Loading engine (Pyodide)…');
    const ready = await waitFor(() => typeof window.pykaraoke_api === 'function', 120000);
    if (!ready) {
      setStatus('Engine failed to load — check the browser console');
      return;
    }
    const pyVer = window.pyodide?.version || '';
    setEngineStatus(`PyScript ready${pyVer ? ` (Pyodide ${pyVer})` : ''}`);
    await restoreState();
    await refreshSettings();
    renderQueue();
    setStatus(tauriCore ? 'Ready — desktop filesystem' : 'Ready — add a folder to scan');
  }

  async function restoreState() {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) callApi('from_json', saved);
      const queueIds = JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]');
      const songs = callApi('library_songs')?.songs || [];
      const byId = new Map(songs.map((s) => [s.id, s]));
      state.queue = new SongQueue(queueIds.map((id) => byId.get(id)).filter(Boolean));
    } catch (err) {
      console.warn('restore failed', err);
    }
    renderLibraryCount();
  }

  async function refreshSettings() {
    const s = callApi('get_settings') || {};
    state.settings = {
      volume: Number(s.volume ?? 0.75),
      sort: s.sort || 'filename',
      zoom: s.cdg_zoom || 'int',
      lookInsideZips: s.look_inside_zips !== false,
      excludeNonMatching: !!s.exclude_non_matching,
      deriveSongInfo: s.derive_song_info !== false,
    };
    $('volume-slider').value = Math.round(state.settings.volume * 100);
    $('volume-value').textContent = `${Math.round(state.settings.volume * 100)}%`;
    $('setting-sort').value = state.settings.sort;
    $('setting-zoom').value = state.settings.zoom;
    $('setting-zips').checked = state.settings.lookInsideZips;
    $('setting-exclude').checked = state.settings.excludeNonMatching;
    $('setting-derive').checked = state.settings.deriveSongInfo;
    applyZoom();
  }

  function persist() {
    try {
      localStorage.setItem(STORAGE_KEY, callApi('to_json'));
      localStorage.setItem(
        QUEUE_KEY,
        JSON.stringify(state.queue.items.map((s) => s.id)),
      );
    } catch (err) {
      console.warn('persist failed', err);
    }
  }

  // ── Scanning ───────────────────────────────────────────────────────
  async function scanEntries(entries) {
    if (!entries.length) return;
    // Keep a basename index (lowercased) for audio/zip lookup.
    for (const e of entries) {
      const base = e.name.toLowerCase();
      if (!state.pathByBase.has(base)) state.pathByBase.set(base, e.path);
    }
    if (!tauriCore) {
      for (const file of window.__pickedFiles || []) {
        const path = file.webkitRelativePath || file.name;
        state.files.set(path, file);
        const base = file.name.toLowerCase();
        if (!state.pathByBase.has(base)) state.pathByBase.set(base, path);
      }
      window.__pickedFiles = [];
    }
    const result = callApi('scan_files', entries);
    await scanZips(entries);
    await refreshSettings();
    renderLibraryCount();
    persist();
    setStatus(`Library: ${result.total} songs`);
    return result;
  }

  async function scanZips(entries) {
    const zips = entries.filter((e) => e.name.toLowerCase().endsWith('.zip'));
    const setting = callApi('get_settings') || {};
    if (!setting.look_inside_zips) return;
    for (const zip of zips) {
      try {
        const bytes = await readBytes(zip.path);
        const r = callApi('scan_zip', zip.name, bytes);
        setStatus(`Added ${r.added} songs from ${zip.name}`);
      } catch (err) {
        console.warn(`zip scan failed: ${zip.name}`, err);
      }
    }
  }

  // ── Rendering ──────────────────────────────────────────────────────
  function renderLibraryCount() {
    const total = callApi('library_songs')?.songs?.length || 0;
    $('library-count').textContent = `${total} songs`;
  }

  function renderResults() {
    const list = $('results-list');
    const kindFilter = {
      cdg: $('filter-cdg').checked,
      kar: $('filter-kar').checked,
      mpg: $('filter-mpg').checked,
      lrc: $('filter-lrc').checked,
    };
    const visible = state.results.filter((s) => kindFilter[s.kind]);
    if (!state.results.length) {
      list.innerHTML = '<div class="no-results">Type to search your library</div>';
      state.selectedResult = -1;
      return;
    }
    if (!visible.length) {
      list.innerHTML = '<div class="no-results">No results match the filters</div>';
      state.selectedResult = -1;
      return;
    }
    list.innerHTML = '';
    visible.forEach((song, i) => {
      const row = document.createElement('div');
      row.className = 'song-row';
      row.setAttribute('role', 'option');
      row.setAttribute('aria-selected', 'false');
      row.dataset.index = String(i);

      const info = document.createElement('div');
      info.className = 'song-row-info';
      info.innerHTML = `<span class="song-row-title">${escapeHtml(songLabel(song))}</span>` +
        `<span class="song-row-file muted">${escapeHtml(song.filename)}</span>`;

      const badge = document.createElement('span');
      badge.className = `badge badge-${song.kind}`;
      badge.textContent = KIND_BADGE[song.kind] || song.kind;
      if (hasElrc(song)) {
        badge.textContent = 'ELRC';
        badge.title = 'Word-level timing (.elrc)';
      }

      const play = document.createElement('button');
      play.className = 'btn btn-icon btn-row-play';
      play.title = 'Play now';
      play.textContent = '▶';
      play.addEventListener('click', (e) => {
        e.stopPropagation();
        playSong(song);
      });

      row.append(badge, info, play);
      row.addEventListener('click', () => enqueue(song));
      row.addEventListener('dblclick', () => playSong(song));
      list.appendChild(row);
    });
    state.selectedResult = -1;
  }

  function selectResult(i) {
    const rows = $('results-list').querySelectorAll('.song-row');
    if (!rows.length) return;
    state.selectedResult = (i + rows.length) % rows.length;
    rows.forEach((r, idx) => {
      const selected = idx === state.selectedResult;
      r.classList.toggle('selected', selected);
      r.setAttribute('aria-selected', String(selected));
    });
    rows[state.selectedResult].scrollIntoView({ block: 'nearest' });
  }

  function renderQueue() {
    const list = $('queue-list');
    if (!state.queue.length) {
      list.innerHTML = '<div class="no-results">Queue is empty — add songs with Enter</div>';
      return;
    }
    list.innerHTML = '';
    state.queue.items.forEach((song, i) => {
      const row = document.createElement('div');
      row.className = 'song-row queue-row';
      const info = document.createElement('div');
      info.className = 'song-row-info';
      info.innerHTML = `<span class="song-row-title">${i + 1}. ${escapeHtml(songLabel(song))}</span>` +
        `<span class="song-row-file muted">${escapeHtml(song.filename)}</span>`;
      const remove = document.createElement('button');
      remove.className = 'btn btn-icon';
      remove.title = 'Remove (Delete)';
      remove.textContent = '✕';
      remove.addEventListener('click', (e) => {
        e.stopPropagation();
        state.queue.removeAt(i);
        renderQueue();
        persist();
      });
      row.append(info, remove);
      row.addEventListener('dblclick', () => playSong(song));
      list.appendChild(row);
    });
  }

  function setStatus(msg) {
    $('status-message').textContent = msg;
  }

  function setEngineStatus(msg) {
    $('engine-status').textContent = msg;
  }

  function setPlaying(song) {
    state.current = song;
    $('current-song-title').textContent = song ? songLabel(song) : '—';
    $('current-song-artist').textContent = song ? song.filename : '';
    $('play-btn').textContent = state.playing ? '⏸' : '▶';
    $('stage-empty').style.display = song ? 'none' : '';
  }

  // ── Stage rendering (CDG) ──────────────────────────────────────────
  const canvas = $('cdg-canvas');
  const stageCtx = canvas.getContext('2d');
  const fullFrame = new ImageData(CDG_WIDTH, CDG_HEIGHT);
  const blitCanvas = document.createElement('canvas');
  blitCanvas.width = CDG_WIDTH;
  blitCanvas.height = CDG_HEIGHT;
  const blitCtx = blitCanvas.getContext('2d');

  function applyZoom() {
    const scale = ZOOM_SCALES[state.settings.zoom] || 1;
    canvas.width = Math.round(CDG_WIDTH * scale);
    canvas.height = Math.round(CDG_HEIGHT * scale);
    canvas.style.width = `${canvas.width}px`;
    canvas.style.height = `${canvas.height}px`;
  }

  function drawCdgUpdate(update) {
    if (update && update.border) {
      const [r, g, b] = update.border;
      stageCtx.fillStyle = `rgb(${r},${g},${b})`;
      stageCtx.fillRect(0, 0, canvas.width, canvas.height);
    }
    if (update && update.tiles) {
      for (const tile of update.tiles) {
        writeTileRgba(tile.data, fullFrame.data, CDG_WIDTH, tile.x, tile.y);
      }
    }
    // Blit the full 288x192 frame, scaled by the canvas transform.
    blitCtx.putImageData(fullFrame, 0, 0);
    stageCtx.imageSmoothingEnabled = false;
    stageCtx.drawImage(blitCanvas, 0, 0, canvas.width, canvas.height);
  }

  // ── Lyrics rendering ───────────────────────────────────────────────
  function renderLyricLines() {
    const box = $('lyrics');
    if (!state.lyricLines || !state.lyricLines.length) {
      box.innerHTML = '';
      box.style.display = 'none';
      return;
    }
    box.style.display = '';
    state.lastLyricLine = -1;
  }

  function updateLyrics(ms) {
    const lines = state.lyricLines;
    if (!lines || !lines.length) return;
    const { lineIdx, litCount } = highlightState(lines, ms);
    if (lineIdx !== state.lastLyricLine) {
      state.lastLyricLine = lineIdx;
      const box = $('lyrics');
      box.innerHTML = '';
      for (const line of lines.slice(lineIdx, lineIdx + 2)) {
        const div = document.createElement('div');
        div.className = 'lyric-line';
        const cls = partClass(line.part);
        if (cls) {
          div.classList.add(cls);
          div.dataset.part = line.part;
          // The part chip labels who sings this line (A, B or shared).
          const chip = document.createElement('span');
          chip.className = 'lyric-part';
          chip.textContent = partLabel(state.parts, line.part);
          div.appendChild(chip);
        }
        if (line !== lines[lineIdx]) div.classList.add('lyric-next');
        line.syllables.forEach((syl) => {
          const span = document.createElement('span');
          span.className = 'lyric-syl';
          span.dataset.ms = String(syl.ms);
          span.textContent = syl.text.replace(/\s+$/, '') + '\u00A0';
          div.appendChild(span);
        });
        box.appendChild(div);
      }
    }
    // Toggle lit state per syllable, order-independent.  Syllables with
    // ms > current are unlit, so a backward seek clears stale highlights.
    const els = $('lyrics').querySelectorAll('.lyric-syl');
    els.forEach((el, i) => el.classList.toggle('lit', i < litCount));
  }

  // ── Transport ──────────────────────────────────────────────────────
  async function playSong(song) {
    stopPlayback();
    state.playing = true;
    setPlaying(song);
    $('stage-empty').style.display = 'none';
    try {
      if (song.kind === 'cdg') {
        await playCdg(song);
      } else if (song.kind === 'kar') {
        await playKar(song);
      } else if (song.kind === 'lrc') {
        await playLrc(song);
      } else {
        await playMpg(song);
      }
    } catch (err) {
      console.error(err);
      // Only tear down if this song is still the current one — a rapid
      // play-next can supersede it before its (async) setup settles.
      if (state.current === song) {
        setStatus(`Playback error: ${err.message}`);
        state.playing = false;
        setPlaying(song);
      }
    }
  }

  /** Drive per-frame work (transport + kind-specific rendering) via rAF. */
  function startLoop(frameFn) {
    cancelAnimationFrame(state.rafId);
    const tick = () => {
      if (!state.playing) return;
      frameFn();
      state.rafId = requestAnimationFrame(tick);
    };
    state.rafId = requestAnimationFrame(tick);
  }

  async function playCdg(song) {
    const cdgBytes = await readSongBytes(song);
    state.cdgKey = callApi('cdg_open', song.id, cdgBytes);
    const audioPath = resolveAudioPath(song);
    if (!audioPath) throw new Error('no audio file found for this CDG');
    const audio = new Audio(mediaUrl(audioPath));
    audio.volume = state.settings.volume;
    audio.addEventListener('ended', onSongEnded);
    audio.addEventListener('loadedmetadata', () => {
      state.durationMs = audio.duration * 1000;
      $('time-total').textContent = formatTime(state.durationMs);
    });
    state.audioEl = audio;
    await audio.play();
    drawCdgUpdate(callApi('cdg_update', state.cdgKey, 0));
    startCdgLoop();
  }

  function startCdgLoop() {
    state.frameFn = () => {
      if (!state.audioEl) return;
      const ms = state.audioEl.currentTime * 1000;
      updateTransport(ms);
      try {
        const update = callApi('cdg_update', state.cdgKey, ms);
        if (update) drawCdgUpdate(update);
      } catch (err) {
        console.warn('cdg update failed', err);
      }
    };
    startLoop(state.frameFn);
  }

  async function playKar(song) {
    const bytes = await readSongBytes(song);
    const parsed = callApi('parse_midi', bytes);
    if (!parsed || parsed.error) throw new Error(parsed?.error || 'could not parse MIDI');
    state.durationMs = parsed.duration_ms || 0;
    $('time-total').textContent = formatTime(state.durationMs);
    // MIDI/KAR lyrics carry no duet parts, so nothing to label.
    state.parts = null;
    state.lyricLines = buildLyricLines(parsed.lyrics || []);
    renderLyricLines();
    state.synth = new MidiSynth(parsed);
    state.synth.onEnded = onSongEnded;
    state.synth.setVolume(state.settings.volume);
    state.synth.start();
    startSynthLoop();
  }

  function startSynthLoop() {
    state.frameFn = () => {
      if (!state.synth) return;
      const ms = state.synth.currentMs();
      updateTransport(ms);
      updateLyrics(ms);
    };
    startLoop(state.frameFn);
  }

  async function playLrc(song) {
    const bytes = await readSongBytes(song);
    // Word-level timing lives in a companion .elrc next to the .lrc.
    const elrcText = await readCompanionText(song, ELRC_EXT);
    const parsed = callApi('parse_lrc', decodeText(bytes), elrcText);
    if (!parsed || parsed.error) throw new Error(parsed?.error || 'could not parse LRC lyrics');
    const audioPath = resolveAudioPath(song);
    if (!audioPath) throw new Error('no audio file found for this LRC');
    // Song-level duet singers ([pa:]/[pb:]) label the per-line part chips.
    state.parts = parsed.parts || null;
    state.lyricLines = buildLyricLines(parsed.lyrics || []);
    renderLyricLines();
    const audio = new Audio(mediaUrl(audioPath));
    audio.volume = state.settings.volume;
    audio.addEventListener('ended', onSongEnded);
    audio.addEventListener('loadedmetadata', () => {
      state.durationMs = audio.duration * 1000;
      $('time-total').textContent = formatTime(state.durationMs);
    });
    state.audioEl = audio;
    await audio.play();
    state.frameFn = () => {
      if (!state.audioEl) return;
      const ms = state.audioEl.currentTime * 1000;
      updateTransport(ms);
      updateLyrics(ms);
    };
    startLoop(state.frameFn);
  }

  async function playMpg(song) {
    if (song.zip_name) throw new Error('video inside zip is not supported');
    const video = document.createElement('video');
    video.src = mediaUrl(resolveSongPath(song));
    video.volume = state.settings.volume;
    video.style.width = '100%';
    video.addEventListener('ended', onSongEnded);
    video.addEventListener('loadedmetadata', () => {
      state.durationMs = video.duration * 1000;
      $('time-total').textContent = formatTime(state.durationMs);
    });
    state.videoEl = video;
    $('video-slot').innerHTML = '';
    $('video-slot').appendChild(video);
    await video.play();
    startVideoLoop();
  }

  function startVideoLoop() {
    state.frameFn = () => {
      if (!state.videoEl) return;
      updateTransport(state.videoEl.currentTime * 1000);
    };
    startLoop(state.frameFn);
  }

  function updateTransport(ms) {
    state.songClock = ms;
    $('time-current').textContent = formatTime(ms);
    const max = state.durationMs || 1;
    $('progress-slider').value = Math.min(1000, Math.round((ms / max) * 1000));
  }

  function togglePlay() {
    if (!state.current) return;
    if (state.playing) {
      state.playing = false;
      if (state.audioEl) state.audioEl.pause();
      if (state.synth) state.synth.pause();
      if (state.videoEl) state.videoEl.pause();
      cancelAnimationFrame(state.rafId);
      $('play-btn').textContent = '▶';
    } else {
      state.playing = true;
      $('play-btn').textContent = '⏸';
      if (state.audioEl) state.audioEl.play();
      if (state.synth) state.synth.resume();
      if (state.videoEl) state.videoEl.play();
      if (state.frameFn) startLoop(state.frameFn);
    }
  }

  function stopPlayback() {
    state.playing = false;
    cancelAnimationFrame(state.rafId);
    state.frameFn = null;
    if (state.audioEl) {
      state.audioEl.pause();
      state.audioEl.src = '';
      state.audioEl = null;
    }
    if (state.synth) {
      state.synth.stop();
      state.synth = null;
    }
    if (state.videoEl) {
      state.videoEl.pause();
      state.videoEl.src = '';
      state.videoEl = null;
      $('video-slot').innerHTML = '';
    }
    if (state.cdgKey) {
      callApi('cdg_close', state.cdgKey);
      state.cdgKey = null;
    }
    state.lyricLines = null;
    state.parts = null;
    $('lyrics').innerHTML = '';
    $('lyrics').style.display = 'none';
    state.durationMs = 0;
    $('time-current').textContent = '0:00';
    $('time-total').textContent = '0:00';
    $('progress-slider').value = 0;
    $('play-btn').textContent = '▶';
  }

  function onSongEnded() {
    const next = state.queue.next();
    renderQueue();
    persist();
    if (next) playSong(next);
    else {
      stopPlayback();
      setPlaying(null);
      setStatus('Queue finished');
    }
  }

  function seekTo(ms) {
    ms = Math.max(0, ms);
    if (state.audioEl) state.audioEl.currentTime = ms / 1000;
    if (state.cdgKey) {
      callApi('cdg_seek', state.cdgKey, ms);
      drawCdgUpdate(callApi('cdg_update', state.cdgKey, ms));
    }
    if (state.synth) state.synth.seek(ms);
    if (state.videoEl) state.videoEl.currentTime = ms / 1000;
    updateTransport(ms);
    // Refresh the displayed lyric immediately (also while paused, when the
    // animation loop is not running).
    updateLyrics(ms);
  }

  function enqueue(song) {
    state.queue.push(song);
    renderQueue();
    persist();
    setStatus(`Queued: ${songLabel(song)}`);
  }

  function playNext() {
    if (state.queue.length) {
      const next = state.queue.next();
      renderQueue();
      persist();
      playSong(next);
    } else {
      setStatus('Queue is empty');
    }
  }

  function playPrev() {
    if (!state.current) return;
    const ms = state.songClock;
    if (ms > 5000) seekTo(0);
    else if (state.queue.length) {
      const next = state.queue.next();
      renderQueue();
      persist();
      playSong(next);
    }
  }

  // ── Settings ───────────────────────────────────────────────────────
  function updateSettings(patch) {
    Object.assign(state.settings, patch);
    callApi('set_settings', patch);
    persist();
    if (patch.volume !== undefined) {
      const v = state.settings.volume;
      if (state.audioEl) state.audioEl.volume = v;
      if (state.videoEl) state.videoEl.volume = v;
      if (state.synth) state.synth.setVolume(v);
    }
    if (patch.zoom !== undefined) applyZoom();
  }

  // ── UI wiring ──────────────────────────────────────────────────────
  const STORAGE_KEY = 'pykaraoke-ng:state';
  const QUEUE_KEY = 'pykaraoke-ng:queue';

  function wireUi() {
    // Folder picking.
    $('add-folder-btn').addEventListener('click', pickFolder);
    $('scan-library-btn').addEventListener('click', rescanFolders);
    $('folder-picker').addEventListener('change', async (e) => {
      const files = [...e.target.files];
      window.__pickedFiles = files;
      const entries = files.map((f) => ({
        name: f.name,
        path: f.webkitRelativePath || f.name,
        size: f.size,
      }));
      await scanEntries(entries);
      e.target.value = '';
    });

    // Search.
    const searchInput = $('search-input');
    searchInput.addEventListener('input', debounce(async () => {
      const q = searchInput.value.trim();
      if (!q) {
        state.results = [];
        renderResults();
        return;
      }
      try {
        const r = callApi('search', q, 500);
        state.results = (r && r.results) || [];
      } catch (err) {
        state.results = [];
        setStatus(`Search error: ${err.message}`);
      }
      renderResults();
    }, 150));

    // Transport.
    $('play-btn').addEventListener('click', togglePlay);
    $('stop-btn').addEventListener('click', () => {
      stopPlayback();
      setPlaying(null);
    });
    $('next-btn').addEventListener('click', playNext);
    $('prev-btn').addEventListener('click', playPrev);
    $('rewind-btn').addEventListener('click', () => seekTo(state.songClock - 5000));
    $('ff-btn').addEventListener('click', () => seekTo(state.songClock + 5000));
    $('progress-slider').addEventListener('input', (e) => {
      const max = state.durationMs || 1;
      seekTo((Number(e.target.value) / 1000) * max);
    });

    // Volume.
    $('volume-slider').addEventListener('input', (e) => {
      const v = Number(e.target.value) / 100;
      $('volume-value').textContent = `${e.target.value}%`;
      updateSettings({ volume: v });
    });

    // Queue.
    $('clear-queue-btn').addEventListener('click', () => {
      state.queue.clear();
      renderQueue();
      persist();
    });

    // Settings panel (inline, no modal).
    $('settings-btn').addEventListener('click', () => {
      $('settings-panel').hidden = !$('settings-panel').hidden;
    });
    $('setting-sort').addEventListener('change', (e) => updateSettings({ sort: e.target.value }));
    $('setting-zoom').addEventListener('change', (e) => updateSettings({ cdg_zoom: e.target.value }));
    $('setting-zips').addEventListener('change', (e) => updateSettings({ look_inside_zips: e.target.checked }));
    $('setting-exclude').addEventListener('change', (e) => updateSettings({ exclude_non_matching: e.target.checked }));
    $('setting-derive').addEventListener('change', (e) => updateSettings({ derive_song_info: e.target.checked }));

    // Kind filters.
    ['filter-cdg', 'filter-kar', 'filter-mpg', 'filter-lrc'].forEach((id) => {
      $(id).addEventListener('change', renderResults);
    });

    // Keyboard-first controls.
    document.addEventListener('keydown', (e) => {
      const target = e.target;
      const inInput = target && (target.tagName === 'INPUT' || target.tagName === 'SELECT');
      if (e.key === '/' || (e.key === 'k' && (e.ctrlKey || e.metaKey))) {
        e.preventDefault();
        searchInput.focus();
        return;
      }
      if (e.key === 'Escape' && inInput) {
        e.target.value = '';
        if (e.target === searchInput) {
          state.results = [];
          renderResults();
        }
        e.target.blur();
        return;
      }
      if (e.key === ' ' && !inInput) {
        e.preventDefault();
        togglePlay();
        return;
      }
      if (e.key === 'Enter' && !inInput && state.selectedResult >= 0) {
        const song = visibleResults()[state.selectedResult];
        if (song) enqueue(song);
        return;
      }
      if (e.key === 'ArrowDown' && !inInput) {
        e.preventDefault();
        selectResult((state.selectedResult + 1) % Math.max(1, visibleResults().length));
      }
      if (e.key === 'ArrowUp' && !inInput) {
        e.preventDefault();
        selectResult((state.selectedResult - 1 + Math.max(1, visibleResults().length)) % Math.max(1, visibleResults().length));
      }
      if (e.key === 'Delete' && !inInput) {
        const list = $('queue-list');
        const selected = list.querySelector('.selected');
        if (selected) {
          const idx = [...list.children].indexOf(selected);
          state.queue.removeAt(idx);
          renderQueue();
          persist();
        }
      }
      if (e.key === 'ArrowDown' && e.ctrlKey) {
        e.preventDefault();
        state.queue.move(0, 1);
        renderQueue();
        persist();
      }
      if (e.key === 'ArrowUp' && e.ctrlKey) {
        e.preventDefault();
        state.queue.move(state.queue.length - 1, -1);
        renderQueue();
        persist();
      }
      if (e.key === 'ArrowRight' && e.ctrlKey) {
        e.preventDefault();
        playNext();
      }
    });
  }

  function visibleResults() {
    const kindFilter = {
      cdg: $('filter-cdg').checked,
      kar: $('filter-kar').checked,
      mpg: $('filter-mpg').checked,
      lrc: $('filter-lrc').checked,
    };
    return state.results.filter((s) => kindFilter[s.kind]);
  }

  async function pickFolder() {
    if (tauriCore) {
      try {
        const path = await tauriCore.invoke('pick_folder');
        if (!path) return;
        const entries = await tauriCore.invoke('list_folder', { path });
        await scanEntries(entries);
      } catch (err) {
        setStatus(`Folder error: ${err.message}`);
      }
    } else {
      $('folder-picker').click();
    }
  }

  async function rescanFolders() {
    const s = callApi('get_settings') || {};
    const folders = s.folders || [];
    if (!folders.length) {
      setStatus('No folders configured — use ＋ Folder');
      return;
    }
    if (!tauriCore) {
      setStatus('In the browser, re-pick the folder to reload files');
      $('folder-picker').click();
      return;
    }
    for (const folder of folders) {
      try {
        const entries = await tauriCore.invoke('list_folder', { path: folder });
        await scanEntries(entries);
      } catch (err) {
        setStatus(`Scan error for ${folder}: ${err.message}`);
      }
    }
  }

  // ── MidiSynth: WebAudio-backed KAR playback ────────────────────────
  class MidiSynth {
    constructor(parsed) {
      this.notes = parsed.notes || [];
      this.programs = parsed.programs || {};
      this.durationMs = parsed.duration_ms || 0;
      this.timeline = computeNoteTimeline(this.notes, this.programs);
      this.ctx = new AudioContext();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.75;
      this.master.connect(this.ctx.destination);
      this.t0 = 0;
      this.nextIndex = 0;
      this.paused = false;
      this.timer = null;
      this.onEnded = null;
    }

    start() {
      this.ctx.resume();
      this.t0 = this.ctx.currentTime;
      this.nextIndex = 0;
      this.paused = false;
      this._schedule();
    }

    resume() {
      if (!this.paused) return;
      this.paused = false;
      this.t0 = this.ctx.currentTime - this.currentMs() / 1000;
      this._schedule();
    }

    pause() {
      this.paused = true;
      clearTimeout(this.timer);
      this.timer = null;
    }

    stop() {
      this.paused = true;
      clearTimeout(this.timer);
      this.timer = null;
      this.ctx.close().catch(() => {});
    }

    seek(ms) {
      clearTimeout(this.timer);
      this.nextIndex = this.timeline.findIndex((n) => n.startMs >= ms);
      if (this.nextIndex < 0) this.nextIndex = this.timeline.length;
      this.t0 = this.ctx.currentTime - ms / 1000;
      if (!this.paused) this._schedule();
    }

    currentMs() {
      return Math.max(0, (this.ctx.currentTime - this.t0) * 1000);
    }

    setVolume(v) {
      this.master.gain.value = v;
    }

    _schedule() {
      clearTimeout(this.timer);
      this.timer = null;
      const lookaheadMs = 200;
      const now = this.currentMs();
      while (
        this.nextIndex < this.timeline.length &&
        this.timeline[this.nextIndex].startMs <= now + lookaheadMs
      ) {
        this._play(this.timeline[this.nextIndex], now);
        this.nextIndex++;
      }
      if (this.nextIndex < this.timeline.length) {
        this.timer = setTimeout(() => this._schedule(), 40);
      } else if (now >= this.durationMs && this.durationMs > 0) {
        if (this.onEnded) this.onEnded();
      } else {
        this.timer = setTimeout(() => this._schedule(), 40);
      }
    }

    _play(note, now) {
      const t = this.t0 + note.startMs / 1000;
      const dur = (note.endMs - note.startMs) / 1000;
      if (note.drum) {
        this._playDrum(t, note.gain);
        return;
      }
      const osc = this.ctx.createOscillator();
      osc.type = note.type;
      osc.frequency.value = note.freq;
      const gain = this.ctx.createGain();
      const peak = note.gain;
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(peak, t + 0.008);
      gain.gain.setValueAtTime(peak, t + Math.max(0, dur - 0.06));
      gain.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.02);
      osc.connect(gain).connect(this.master);
      osc.start(t);
      osc.stop(t + dur + 0.05);
    }

    _playDrum(t, gain) {
      const buffer = this.ctx.createBuffer(1, Math.floor(this.ctx.sampleRate * 0.12), this.ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < data.length; i++) {
        data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / data.length, 2);
      }
      const src = this.ctx.createBufferSource();
      src.buffer = buffer;
      const g = this.ctx.createGain();
      g.gain.value = gain;
      src.connect(g).connect(this.master);
      src.start(t);
    }
  }

  // Boot.
  document.addEventListener('DOMContentLoaded', () => {
    wireUi();
    boot();
  });
}
</script>
