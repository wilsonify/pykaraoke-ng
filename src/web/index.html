<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PyKaraoke NG</title>
  <style>
/* PyKaraoke NG — slim sidebar DJ panel
   (see openspec/specs/ux-slim-sidebar/spec.md). */

:root {
  --bg: #14151a;
  --bg-elevated: #1c1e25;
  --bg-input: #101116;
  --border: #2c2f3a;
  --text: #e8e9ed;
  --text-dim: #9aa0ae;
  --accent: #e8b64c;
  --accent-strong: #ffd173;
  --danger: #e06c75;
  --ok: #7ec699;
  --radius: 6px;
  /* Duet parts (generic singer ids): blue = A, green = B, violet = shared. */
  --part-a: #6cb6ff;
  --part-a-lit: #a9d4ff;
  --part-b: #7ec699;
  --part-b-lit: #a9e3c0;
  --part-ab: #c39bff;
  --part-ab-lit: #ddc8ff;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
}

#app {
  display: flex;
  flex-direction: column;
  height: 100vh;
  width: 100%;
  max-width: 450px;
  margin: 0 auto;
}

/* ── Fixed top ─────────────────────────────────────────────────────── */
.app-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 10px;
  background: var(--bg-elevated);
  border-bottom: 1px solid var(--border);
  flex: none;
}
.app-title { font-weight: 600; font-size: 14px; }
.header-actions { display: flex; gap: 6px; align-items: center; }

/* ── Scrollable middle ─────────────────────────────────────────────── */
.main-column {
  flex: 1 1 auto;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 10px;
  min-height: 0;
}

.filters {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 6px 10px;
  background: var(--bg-elevated);
}
.filters summary { cursor: pointer; color: var(--text-dim); font-weight: 600; }
.filter-row {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 6px;
  flex-wrap: wrap;
}
.kind-filter { display: inline-flex; gap: 4px; align-items: center; color: var(--text-dim); }

.search-box input {
  width: 100%;
  padding: 8px 10px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--bg-input);
  color: var(--text);
  outline: none;
}
.search-box input:focus { border-color: var(--accent); }

/* ── Song lists ────────────────────────────────────────────────────── */
.section-label {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-dim);
  font-weight: 600;
}
.section-header { display: flex; justify-content: space-between; align-items: center; }

.song-list { display: flex; flex-direction: column; gap: 2px; margin: 4px 0 0; padding: 0; list-style: none; }
.no-results { color: var(--text-dim); padding: 8px 4px; font-style: italic; }

.song-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 5px 8px;
  border-radius: var(--radius);
  cursor: pointer;
  border: 1px solid transparent;
}
.song-row:hover { background: var(--bg-elevated); }
.song-row.selected { background: var(--bg-elevated); border-color: var(--accent); }

.song-row-info { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.song-row-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.song-row-file { font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.results-section, .queue-section, .player-section { display: flex; flex-direction: column; gap: 4px; }

/* ── Badges ────────────────────────────────────────────────────────── */
.badge {
  font-size: 10px;
  padding: 1px 5px;
  border-radius: 3px;
  border: 1px solid var(--border);
  color: var(--text-dim);
  flex: none;
}
.badge-cdg { color: var(--ok); border-color: var(--ok); }
.badge-kar { color: var(--accent); border-color: var(--accent); }
.badge-mpg { color: #6cb6ff; border-color: #6cb6ff; }

/* ── Stage ─────────────────────────────────────────────────────────── */
.stage {
  background: #000;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 90px;
  padding: 8px;
  position: relative;
}
#cdg-canvas {
  image-rendering: pixelated;
  max-width: 100%;
  background: #000;
}
.stage-empty { color: var(--text-dim); font-style: italic; }
#video-slot video { display: block; border-radius: 4px; }
.lyrics {
  margin-top: 8px;
  width: 100%;
  text-align: center;
}
.lyric-line {
  font-size: 16px;
  font-weight: 600;
  color: var(--text-dim);
  min-height: 1.3em;
}
/* Duet lines: colour by singer/part; untagged lines keep the dim default. */
.lyric-line.part-a { color: var(--part-a); }
.lyric-line.part-b { color: var(--part-b); }
.lyric-line.part-ab { color: var(--part-ab); }
/* Declared after the part colours so the upcoming line always dims. */
.lyric-line.lyric-next { color: #5a5f6e; font-size: 14px; }
/* Part chip: "A", "B", "A+B", or the song's [pa:]/[pb:] display names. */
.lyric-part {
  display: inline-block;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.05em;
  margin-right: 5px;
  padding: 0 4px;
  border: 1px solid currentColor;
  border-radius: 3px;
  vertical-align: 1px;
}
.lyric-syl.lit { color: var(--accent-strong); }
/* Sung syllables light up in the line's own (brighter) part colour. */
.lyric-line.part-a .lyric-syl.lit { color: var(--part-a-lit); }
.lyric-line.part-b .lyric-syl.lit { color: var(--part-b-lit); }
.lyric-line.part-ab .lyric-syl.lit { color: var(--part-ab-lit); }

/* ── Player controls ───────────────────────────────────────────────── */
.now-playing-info { margin-top: 6px; }
.song-title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.song-artist { font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.player-controls {
  display: flex;
  gap: 6px;
  align-items: center;
  justify-content: center;
  margin-top: 6px;
}
.btn-control {
  width: 34px;
  height: 34px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--bg-elevated);
  color: var(--text);
  cursor: pointer;
  font-size: 14px;
  line-height: 1;
}
.btn-control:hover { border-color: var(--accent); }
.btn-play { background: var(--accent); color: #1a1408; border-color: var(--accent); }

.progress-row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
#progress-slider, #volume-slider { flex: 1; accent-color: var(--accent); }
.time-display { font-size: 11px; color: var(--text-dim); white-space: nowrap; }
.volume-row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }

/* ── Buttons ───────────────────────────────────────────────────────── */
.btn {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--bg-elevated);
  color: var(--text);
  cursor: pointer;
  padding: 5px 10px;
  font-size: 12px;
}
.btn:hover { border-color: var(--accent); }
.btn-primary { background: var(--accent); color: #1a1408; border-color: var(--accent); font-weight: 600; }
.btn-primary:hover { background: var(--accent-strong); }
.btn-sm { padding: 3px 8px; font-size: 11px; }
.btn-icon { padding: 2px 6px; font-size: 12px; background: transparent; }

/* ── Status bar ────────────────────────────────────────────────────── */
.status-bar {
  flex: none;
  display: flex;
  justify-content: space-between;
  gap: 8px;
  padding: 6px 10px;
  background: var(--bg-elevated);
  border-top: 1px solid var(--border);
  font-size: 11px;
  color: var(--text-dim);
  white-space: nowrap;
  overflow: hidden;
}

/* ── Settings panel (inline, no modal) ─────────────────────────────── */
.settings-panel {
  flex: none;
  border-top: 1px solid var(--border);
  background: var(--bg-elevated);
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.settings-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}
.settings-row select {
  background: var(--bg-input);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 4px 6px;
}

.muted { color: var(--text-dim); }
  </style>
  <link rel="stylesheet" href="/_assets/pyscript/core.css" />
  <script type="module" src="/_assets/pyscript/core.js"></script>
</head>
<body>
  <py-config>
    interpreter = "/_assets/pyodide/pyodide.mjs"
    packages = ["/_wheel/pykaraoke_ng-0.8.0-py3-none-any.whl"]
    terminal = false
  </py-config>

  <div id="app">
    <!-- Fixed top: search + library -->
    <header class="app-header">
      <span class="app-title">🎤 PyKaraoke NG</span>
      <div class="header-actions">
        <button id="add-folder-btn" class="btn btn-primary btn-sm" title="Add a songs folder">＋ Folder</button>
        <button id="settings-btn" class="btn btn-icon" title="Settings">⚙️</button>
      </div>
    </header>

    <main class="main-column">

      <!-- Library / scan -->
      <details id="library-filters" class="filters">
        <summary>Library</summary>
        <div class="filter-row">
          <button id="scan-library-btn" class="btn btn-secondary btn-sm">Rescan folders</button>
          <button id="replace-library-btn" class="btn btn-secondary btn-sm">Replace library</button>
          <button id="export-library-btn" class="btn btn-secondary btn-sm">Export</button>
          <button id="import-library-btn" class="btn btn-secondary btn-sm">Import</button>
          <span id="library-count" class="muted"></span>
        </div>
        <div id="scan-summary" class="muted" hidden></div>
      </details>

      <!-- Search -->
      <section class="search-section">
        <div class="search-box">
          <input type="text" id="search-input" list="search-results" placeholder="Search songs…  ( / to focus, Esc to clear )" autocomplete="off" aria-label="Search songs" />
          <datalist id="search-results"></datalist>
        </div>
        <div class="filter-row">
          <label class="kind-filter"><input type="checkbox" id="filter-cdg" checked /> CDG</label>
          <label class="kind-filter"><input type="checkbox" id="filter-kar" checked /> KAR/MID</label>
          <label class="kind-filter"><input type="checkbox" id="filter-mpg" checked /> MPG</label>
          <label class="kind-filter"><input type="checkbox" id="filter-lrc" checked /> LRC</label>
        </div>
      </section>

      <!-- Results -->
      <section class="results-section">
        <div class="section-label">Results</div>
        <div id="results-list" class="song-list" aria-label="Search results"></div>
      </section>

      <!-- Now playing / stage -->
      <section class="player-section">
        <div class="section-label">Now Playing</div>
        <div id="stage" class="stage">
          <canvas id="cdg-canvas" width="576" height="384"></canvas>
          <div id="lyrics" class="lyrics"></div>
          <div id="video-slot"></div>
          <div id="stage-empty" class="stage-empty">No song loaded</div>
        </div>
        <div class="now-playing-info">
          <div id="current-song-title" class="song-title">—</div>
          <div id="current-song-artist" class="song-artist muted"></div>
        </div>
        <div class="player-controls">
          <button id="prev-btn" class="btn-control" title="Previous (Ctrl+↑)">⏮</button>
          <button id="rewind-btn" class="btn-control" title="Rewind 5s">⏪</button>
          <button id="play-btn" class="btn-control btn-play" title="Play / Pause (Space)">▶</button>
          <button id="stop-btn" class="btn-control" title="Stop">⏹</button>
          <button id="ff-btn" class="btn-control" title="Forward 5s">⏩</button>
          <button id="next-btn" class="btn-control" title="Next (Ctrl+→)">⏭</button>
        </div>
        <div class="progress-row">
          <input type="range" id="progress-slider" min="0" max="1000" value="0" step="1" aria-label="Song position" />
          <span class="time-display"><span id="time-current">0:00</span> / <span id="time-total">0:00</span></span>
        </div>
        <div class="volume-row">
          <span title="Volume">🔊</span>
          <input type="range" id="volume-slider" min="0" max="100" value="75" aria-label="Volume" />
          <span id="volume-value" class="muted">75%</span>
        </div>
      </section>

      <!-- Queue -->
      <section class="queue-section">
        <div class="section-header">
          <span class="section-label">Queue</span>
          <button id="clear-queue-btn" class="btn btn-secondary btn-sm">Clear</button>
        </div>
        <ul id="queue-list" class="song-list" aria-label="Queue"></ul>
      </section>
    </main>

    <!-- Fixed bottom: status -->
    <footer class="status-bar">
      <span id="status-message">Loading engine…</span>
      <span id="engine-status" class="muted">PyScript: connecting</span>
    </footer>
  </div>

  <!-- Settings (inline collapsible, no modal per UX spec) -->
  <div id="settings-panel" class="settings-panel" hidden>
    <div class="settings-row">
      <label for="setting-sort">Sort library by</label>
      <select id="setting-sort">
        <option value="filename">Filename</option>
        <option value="title">Title</option>
        <option value="artist">Artist</option>
      </select>
    </div>
    <div class="settings-row">
      <label for="setting-zoom">CDG zoom</label>
      <select id="setting-zoom">
        <option value="quick">Quick (0.75×)</option>
        <option value="int">Normal (1×)</option>
        <option value="full">Large (1.5×)</option>
        <option value="soft">Full (2×)</option>
      </select>
    </div>
    <div class="settings-row">
      <label for="setting-zips">Look inside .zip files</label>
      <input type="checkbox" id="setting-zips" checked />
    </div>
    <div class="settings-row">
      <label for="setting-exclude">Hide songs without artist</label>
      <input type="checkbox" id="setting-exclude" />
    </div>
    <div class="settings-row">
      <label for="setting-derive">Derive song info from filename</label>
      <input type="checkbox" id="setting-derive" checked />
    </div>
    <div class="settings-row">
      <label for="setting-naming">Naming convention</label>
      <select id="setting-naming">
        <option value="0">Disc Track - Artist - Title</option>
        <option value="1">DiscTrack - Artist - Title</option>
        <option value="2">Disc - Artist - Title</option>
        <option value="3">Artist - Title</option>
        <option value="4">Disc-Track - Artist - Title (spaced)</option>
      </select>
    </div>
    <div class="settings-row">
      <label for="setting-include-patterns">Include patterns (comma separated)</label>
      <input type="text" id="setting-include-patterns" placeholder="e.g. CB*.cdg" />
    </div>
    <div class="settings-row">
      <label for="setting-exclude-patterns">Exclude patterns (comma separated)</label>
      <input type="text" id="setting-exclude-patterns" placeholder="e.g. *(vocal)*" />
    </div>
  </div>

  <input type="file" id="folder-picker" webkitdirectory multiple hidden aria-label="Choose a songs folder" />
  <input type="file" id="import-library-picker" accept=".json,application/json" hidden aria-label="Import library from a JSON file" />

  <script type="py">
"""PyScript bridge: expose the karaoke engine to the inline app script.

Loaded by PyScript from this ``<script type="py">`` block.  Builds a
:class:`pykaraoke.webapp.KaraokeApp` and publishes a single JSON-friendly
dispatcher to ``window.pykaraoke_api``.

Boundary rules:

* JS ``Uint8Array`` arguments arrive as Python ``bytes``/``memoryview``
  (Pyodide auto-conversion), which the engine accepts directly.
* JS objects/arrays are converted deeply with ``to_py()`` so the engine
  sees plain dicts/lists.
* Return values are Python objects; the app script converts PyProxies
  with ``toJs()``.  ``None`` becomes JS ``undefined`` automatically.
"""

from js import window

from pykaraoke.webapp import KaraokeApp

app = KaraokeApp()


def _to_py(value):
    """Deep-convert a JS value into a plain Python value."""
    if hasattr(value, "to_py"):
        return value.to_py()
    return value


def api(name, *args):
    """Call ``app.<name>(*args)`` with converted arguments."""
    return getattr(app, name)(*[_to_py(a) for a in args])


window.pykaraoke_api = api
</script>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
