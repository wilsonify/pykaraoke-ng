[project]
name = "pykaraoke-ng"
version = "0.8.0"
description = "PyKaraoke - CD+G/MPEG/KAR Karaoke Player (browser + Pyodide edition)"
readme = "README.md"
license = { text = "LGPL-2.1-or-later" }
requires-python = ">=3.10"
authors = [
    { name = "Kelvin Lawson", email = "kelvinl@users.sourceforge.net" },
    { name = "PyKaraoke Development Team" },
]
maintainers = [
    { name = "PyKaraoke-NG Contributors" },
]
keywords = ["karaoke", "cdg", "midi", "kar", "mpeg", "music", "player"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU Lesser General Public License v2 or later (LGPLv2+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Players",
    "Topic :: Multimedia :: Video :: Display",
]

# The engine is pure stdlib: the same modules run under CPython (tests)
# and under Pyodide (the PyScript UI). No pygame, numpy, or mutagen.
dependencies = []

[project.optional-dependencies]
dev = [
    "build>=1.2.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]
all = [
    "pykaraoke-ng[dev,test]",
]

[project.urls]
Homepage = "https://github.com/wilsonify/pykaraoke-ng"
Documentation = "https://github.com/wilsonify/pykaraoke-ng#readme"
Repository = "https://github.com/wilsonify/pykaraoke-ng.git"
Issues = "https://github.com/wilsonify/pykaraoke-ng/issues"

[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pykaraoke"]
exclude = [
    "tests/",
    "scripts/",
    "web/",
    "src-tauri/",
    "deploy/",
    ".git/",
    ".venv/",
    "__pycache__/",
    "*.pyc",
]

[tool.hatch.build.targets.sdist]
exclude = [
    ".git/",
    ".venv/",
    "__pycache__/",
    "*.pyc",
    "htmlcov/",
    ".coverage",
    ".pytest_cache/",
]

[dependency-groups]
dev = [
    "build>=1.2.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]

# Ruff Configuration (modern Python linter/formatter)
[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
    "web/_assets",
    "web/_wheel",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "C901",   # too complex
    "W191",   # indentation contains tabs
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["pykaraoke"]

# Pytest Configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "-q",
    "--strict-markers",
    "--strict-config",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

# Coverage Configuration
[tool.coverage.run]
source = ["."]
branch = true
omit = [
    ".venv/*",
    "tests/*",
    "*/__pycache__/*",
    "web/_assets/*",
    "web/_wheel/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "pass",
]
show_missing = true
skip_covered = true

[tool.coverage.html]
directory = "htmlcov"

# MyPy Configuration
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = [
    "^.venv/",
    "^tests/",
    "^web/_assets/",
    "^web/_wheel/",
]